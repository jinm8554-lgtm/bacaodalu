<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>八草圣殿：征服帝国</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* === THEME ENGINE === */
        :root {
            /* Default: Deep Abyss (魅魔紫) */
            --bg-core: #05010a;
            --bg-glass: rgba(20, 10, 30, 0.65);
            --bg-glass-heavy: rgba(10, 5, 20, 0.85);
            --primary: #ff0055;
            --primary-glow: rgba(255, 0, 85, 0.6);
            --accent: #7000ff;
            --text-main: #f0f0f0;
            --text-dim: #a0a0b0;
            --border-glass: rgba(255, 255, 255, 0.08);
            --bubble-user: #ff0055;
            --bubble-ai: rgba(255, 255, 255, 0.03);
        }

        .theme-gold {
            /* Fallen Sanctuary (黑金) */
            --bg-core: #080808;
            --bg-glass: rgba(25, 25, 25, 0.75);
            --bg-glass-heavy: rgba(15, 15, 15, 0.9);
            --primary: #d4af37;
            --primary-glow: rgba(212, 175, 55, 0.5);
            --accent: #ffffff;
            --text-main: #fcfcfc;
            --text-dim: #999999;
            --border-glass: rgba(212, 175, 55, 0.2);
            --bubble-user: #d4af37;
            --bubble-ai: rgba(212, 175, 55, 0.05);
        }

        .theme-venom {
            /* Cyber Venom (极客绿) */
            --bg-core: #000a00;
            --bg-glass: rgba(0, 20, 10, 0.7);
            --bg-glass-heavy: rgba(0, 15, 5, 0.9);
            --primary: #00ff9d;
            --primary-glow: rgba(0, 255, 157, 0.5);
            --accent: #008f5a;
            --text-main: #e0ffe0;
            --text-dim: #60a080;
            --border-glass: rgba(0, 255, 157, 0.15);
            --bubble-user: #008f5a;
            --bubble-ai: rgba(0, 255, 157, 0.05);
        }

        .theme-blood {
            /* Crimson Velvet (暴虐红) */
            --bg-core: #0a0000;
            --bg-glass: rgba(30, 5, 5, 0.75);
            --bg-glass-heavy: rgba(20, 0, 0, 0.9);
            --primary: #ff2a2a;
            --primary-glow: rgba(255, 42, 42, 0.6);
            --accent: #800000;
            --text-main: #fff0f0;
            --text-dim: #a06060;
            --border-glass: rgba(255, 42, 42, 0.2);
            --bubble-user: #990000;
            --bubble-ai: rgba(255, 42, 42, 0.05);
        }

        /* === GLOBAL STYLES === */
        body {
            background-color: var(--bg-core);
            background-image: 
                radial-gradient(circle at center, transparent 0%, var(--bg-core) 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            color: var(--text-main);
            font-family: 'Noto Serif SC', serif;
            overscroll-behavior: none;
            transition: background-color 0.5s ease;
        }

        /* Utility Classes */
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
        }

        .glass-panel-heavy {
            background: var(--bg-glass-heavy);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
        }

        .neon-text {
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary-glow);
        }

        .neon-border {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; opacity: 0.5; }

        /* Animations */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 5px var(--primary-glow); }
            50% { box-shadow: 0 0 15px var(--primary-glow), 0 0 5px var(--primary); }
        }
        .animate-pulse-glow { animation: pulse-glow 2s infinite; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        core: 'var(--bg-core)',
                        glass: 'var(--bg-glass)',
                        primary: 'var(--primary)',
                        accent: 'var(--accent)',
                        main: 'var(--text-main)',
                        dim: 'var(--text-dim)',
                    },
                    borderColor: {
                        glass: 'var(--border-glass)',
                        primary: 'var(--primary)',
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
